name: Deploy Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_live_ai_smoke:
        description: "Run live retrieve/answer smoke after deploy"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Terraform Apply, Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false

      - name: Authenticate to Google Cloud through WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        id: backend_image
        shell: bash
        run: |
          set -euo pipefail
          base="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/backend"
          tag="${base}:${IMAGE_TAG}"
          docker build -f backend/Dockerfile -t "${tag}" .
          docker push "${tag}"
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{.Digest}}')"
          image="${base}@${digest}"
          echo "::add-mask::${image}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Build and push frontend image
        id: frontend_image
        shell: bash
        run: |
          set -euo pipefail
          base="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/frontend"
          tag="${base}:${IMAGE_TAG}"
          docker build \
            -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_BEFORE_API_BASE_URL="${{ vars.NEXT_PUBLIC_BEFORE_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            -t "${tag}" \
            frontend
          docker push "${tag}"
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{.Digest}}')"
          image="${base}@${digest}"
          echo "::add-mask::${image}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Terraform apply backend runtime
        shell: bash
        env:
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SA }}
        run: |
          set -euo pipefail
          root="infra/terraform/envs/dev/runtime/backend"
          terraform -chdir="${root}" init \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="prefix=envs/dev/runtime/backend"
          terraform -chdir="${root}" plan \
            -var-file=terraform.tfvars.example \
            -var="backend_image=${{ steps.backend_image.outputs.image }}" \
            -out=tfplan
          terraform -chdir="${root}" apply -auto-approve tfplan

      - name: Terraform apply frontend runtime
        shell: bash
        env:
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SA }}
        run: |
          set -euo pipefail
          root="infra/terraform/envs/dev/runtime/frontend"
          terraform -chdir="${root}" init \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="prefix=envs/dev/runtime/frontend"
          terraform -chdir="${root}" plan \
            -var-file=terraform.tfvars.example \
            -var="frontend_image=${{ steps.frontend_image.outputs.image }}" \
            -out=tfplan
          terraform -chdir="${root}" apply -auto-approve tfplan

      - name: Post-deploy smoke
        shell: bash
        env:
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SA }}
          RUN_LIVE_AI_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_ai_smoke == true }}
        run: |
          set -euo pipefail
          backend_root="infra/terraform/envs/dev/runtime/backend"
          frontend_root="infra/terraform/envs/dev/runtime/frontend"
          backend_url="$(terraform -chdir="${backend_root}" output -raw backend_url)"
          frontend_url="$(terraform -chdir="${frontend_root}" output -raw frontend_url)"
          echo "::add-mask::${backend_url}"
          echo "::add-mask::${frontend_url}"

          curl --fail --silent --show-error "${backend_url}/health" >/tmp/lmr-health.json
          curl --fail --silent --show-error "${backend_url}/api/v1/auth/me" >/tmp/lmr-auth-negative.json
          protected_status="$(
            curl --silent --show-error --output /tmp/lmr-protected-negative.json --write-out '%{http_code}' \
              "${backend_url}/api/v1/scn001/bridge-runs"
          )"
          test "${protected_status}" = "401"
          curl --fail --silent --show-error \
            -H "content-type: application/json" \
            --data-binary @backend/verify/fixtures/document_draft_scn004_unfair_dismissal_brief.json \
            "${backend_url}/api/v1/documents/draft" >/tmp/lmr-document-draft.json

          for path in / /before /after /after/result /after/intake /after/draft /history; do
            curl --fail --silent --show-error --location "${frontend_url}${path}" >/dev/null
          done

          if [[ "${RUN_LIVE_AI_SMOKE}" == "true" ]]; then
            curl --fail --silent --show-error \
              -H "content-type: application/json" \
              --data '{"query":"퇴직금을 못 받았어요","top_k":5,"ef_search":100}' \
              "${backend_url}/api/v1/retrieve" >/tmp/lmr-retrieve.json
            curl --fail --silent --show-error \
              -H "content-type: application/json" \
              --data '{"query":"퇴직금을 못 받았어요","top_k":5,"ef_search":100}' \
              "${backend_url}/api/v1/answer" >/tmp/lmr-answer.json
          fi

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Dev Deploy"
            echo "- commit: ${GITHUB_SHA}"
            echo "- backend image: immutable digest captured"
            echo "- frontend image: immutable digest captured"
            echo "- terraform apply: passed"
            echo "- post-deploy smoke: passed"
          } >> "${GITHUB_STEP_SUMMARY}"
