name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Backend import smoke
        env:
          DATABASE_URL: "sqlite:///./ci-smoke.db"
        run: python -c "from backend.main import app; print('backend_import_ok')"

      - name: Document draft deterministic smoke
        env:
          DATABASE_URL: "sqlite:///./ci-smoke.db"
        run: python backend/verify/check_document_draft.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate dev roots
        shell: bash
        run: |
          set -euo pipefail
          roots=(
            infra/terraform/envs/dev/foundation
            infra/terraform/envs/dev/data
            infra/terraform/envs/dev/runtime/backend
            infra/terraform/envs/dev/runtime/frontend
            infra/terraform/envs/dev/cicd
          )
          for root in "${roots[@]}"; do
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done

      - name: Secret pattern guard
        shell: bash
        run: |
          set -euo pipefail
          private_key_json='"private_''key"[[:space:]]*:'
          service_account_json='"type"[[:space:]]*:[[:space:]]*"service_''account"'
          private_key_pem='-----BEGIN PRIVATE ''KEY-----'
          postgres_url='post''gres(ql)?://[^[:space:]]+:[^[:space:]]+@'
          secret_pattern="(${private_key_json}|${service_account_json}|${private_key_pem}|${postgres_url})"
          if git grep -n -I -E "${secret_pattern}" -- . ':!frontend/package-lock.json'; then
            echo "Potential committed secret material found." >&2
            exit 1
          fi
